version: "1"

package:
  id: org.deepin.camera
  name: "deepin-camera"
  version: 6.5.48.1
  kind: app
  description: |
    camera for deepin os.

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/6.7.0

command:
  - deepin-camera

build: |
  # 修改路径
  find src -type f -name "*.service" -exec sed -i 's|^Exec=.*|Exec=deepin-camera|g' {} +

  # buildext.apt 安装依赖到系统路径而非 $PREFIX，修正 CMakeLists.txt 中的 include 路径
  sed -i 's|${CMAKE_INSTALL_PREFIX}/include|/usr/include|g' src/CMakeLists.txt

  # 构建
  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  cmake -B build ${conf_args} \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=${PREFIX} \
        -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
        -DVERSION=${VERSION} \
        -DLINGLONG_BUILD_ON=1
  cmake --build build -j`nproc`
  cmake --build build --target install > install.log 2>&1

  # blas/lapack 通过 alternatives 安装到子目录，复制到主库目录以供 ldd 检查通过
  mkdir -p ${PREFIX}/lib/${TRIPLET}
  cp -aL /usr/lib/${TRIPLET}/blas/libblas.so.3* ${PREFIX}/lib/${TRIPLET}/ 2>/dev/null || true
  cp -aL /usr/lib/${TRIPLET}/lapack/liblapack.so.3* ${PREFIX}/lib/${TRIPLET}/ 2>/dev/null || true

# allow apt download in build and do apt update
buildext:
  apt:
    build_depends:
      - cmake
      - deepin-gettext-tools
      - libavutil-dev
      - libavformat-dev
      - libavcodec-dev
      - libavfilter-dev
      - libv4l-dev
      - libsdl2-dev
      - portaudio19-dev
      - libasound2-dev
      - libpciaccess-dev
      - libusb-1.0-0-dev
      - libswscale-dev
      - libswresample-dev
      - libffmpegthumbnailer-dev
      - libva-dev
      - libimageeditor6-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
    depends:
      - libffmpegthumbnailer4v5
      - libportaudio2
      - deepin-event-log
      - libimageeditor6
      - libsdl2-2.0-0
      - gstreamer1.0-plugins-good
