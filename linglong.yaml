version: "1"

package:
  id: org.deepin.camera
  name: "deepin-camera"
  version: 6.5.50.1
  kind: app
  description: |
    camera for deepin os.

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/6.7.0

command:
  - deepin-camera

build: |
  # 调整头文件查找路径：gstreamer / libusb 开发头文件经 buildext 装入 /usr/include
  # （原脚本由 install_dep 解包到 ${PREFIX}/include），修正 src/CMakeLists.txt
  # Qt6 分支的硬编码路径；glib 头文件由 pkg_check_modules(gobject-2.0) 提供
  sed -i 's|${CMAKE_INSTALL_PREFIX}/include/gstreamer-1.0|/usr/include/gstreamer-1.0|g' src/CMakeLists.txt
  sed -i 's|${CMAKE_INSTALL_PREFIX}/include/libusb-1.0|/usr/include/libusb-1.0|g' src/CMakeLists.txt

  # 修改路径
  find src -type f -name "*.service" -exec sed -i 's|^Exec=.*|Exec=deepin-camera|g' {} +

  # 构建
  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  cmake -B build-linglong ${conf_args} \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=${PREFIX} \
        -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
        -DVERSION=${VERSION} \
        -DLINGLONG_BUILD_ON=1
  cmake --build build-linglong -j`nproc`
  cmake --build build-linglong --target install > install.log 2>&1

  # libblas3/liblapack3 经 apt 闭包（libimageeditor6 推荐链）带入层，其顶层
  # libblas.so.3/liblapack.so.3 是指向 /etc/alternatives 的软链（层内不存在），
  # 复制真实库到应用库目录，保证层内 ffmpegthumbnailer/ffmpeg 等二进制的
  # 依赖可解析（ldd 运行时检查），替代旧配方的 mv blas/lapack 逻辑
  install -d -m 0755 ${PREFIX}/lib/${TRIPLET}
  for n in libblas.so.3 liblapack.so.3; do
      src=$(readlink -f /usr/lib/${TRIPLET}/$n 2>/dev/null || true)
      if [ -n "$src" ] && [ -e "$src" ]; then
          cp -L "$src" ${PREFIX}/lib/${TRIPLET}/$n
      fi
  done

  # deepin-camera 运行时用 dlopen 按裸名加载库（libPath()/load_libs.c），层内
  # 与 base 均无裸名符号链接，需按旧层配方补齐，否则缩略图等功能失效；仅补
  # base 缺失的项（base 有的项应用代码可通过版本名命中，如 libavcodec/avutil/
  # swresample/udev/v4l2）。libavformat60/libswscale7 仅由 runtime 层提供，
  # 不在 Qt LibrariesPath 扫描目录（/usr/lib/${TRIPLET}）内，libPath 会退回
  # 裸名再走 ld.so 解析，而 ld.so 不做通配匹配，缺裸名链接即 dlopen 失败：
  # 录像链路（libcam_encoder mp4/muxer → getAvformat）dlopen("libavformat.so")
  # 失败后全部 dlsym 返回空，调用即 SIGSEGV（ll-box retval=139），因此
  # libavformat.so 与 libswscale.so/libffmpegthumbnailer.so/libportaudio.so
  # 必须一并补齐。
  # build: 阶段依赖库已在构建容器 /usr（build_depends -dev 包提供），取真实
  # 版本名建裸名链接；若 depends 闭包未把真实文件带入应用库目录（skip_existing
  # 行为随构建器版本可能变化），兜底 cp -L 复制真实文件，确保裸名链接与其
  # 目标同目录、运行期可解析
  cd ${PREFIX}/lib/${TRIPLET}
  for n in libavformat.so libswscale.so libffmpegthumbnailer.so libportaudio.so; do
      src=$(readlink -f /usr/lib/${TRIPLET}/$n 2>/dev/null || true)
      [ -n "$src" ] && [ -e "$src" ] || continue
      real=$(basename "$src")
      if [ ! -e "./$real" ]; then
          cp -L "$src" "./$real"
      fi
      ln -sf "$real" "$n"
  done
  cd - >/dev/null

  # 滤镜 LUT 数据（滤镜功能必需）：buildext.apt 的 depends 合并仅拷贝 bin/、
  # sbin/、lib/（linglong_builder mergeOutput 白名单），不包含 share/，而旧
  # install_dep 整包解包会把 libimageeditor6 的
  # /usr/share/libimagevisualresult6/filter_cube（.CUBE/.dat 滤镜查找表）带入层。
  # 应用启动时按编译期 LUT_DIR（${PREFIX}/share/libimagevisualresult6/filter_cube，
  # main.cpp initFilters）加载滤镜，目录缺失则全部滤镜失效
  # （"filter:xxx file is not found"）。构建容器内该目录由 build_depends 的
  # libimageeditor6-dev → libimageeditor6 提供，此处复制进应用层
  if [ -d /usr/share/libimagevisualresult6/filter_cube ]; then
      install -d -m 0755 ${PREFIX}/share/libimagevisualresult6/filter_cube
      cp -a /usr/share/libimagevisualresult6/filter_cube/. \
            ${PREFIX}/share/libimagevisualresult6/filter_cube/
  fi

buildext:
  apt:
    # 构建依赖：仅声明 base/runtime 层未提供的构建期包。
    # Qt6/DTK6/X11/glib/udev 等开发包与工具链由 runtime 层和 base 层提供。
    build_depends:
      - cmake
      - libavutil-dev
      - libavformat-dev
      - libavcodec-dev
      - libswscale-dev
      - libswresample-dev
      - libv4l-dev
      - portaudio19-dev
      - libpciaccess-dev
      - libusb-1.0-0-dev
      - libffmpegthumbnailer-dev
      - libva-dev
      - libimageeditor6-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
    # 运行依赖：仅声明 base/runtime 层未提供的直接运行时包。
    # ffmpeg/udev/v4l2/usb 等运行库已在 base/runtime 中；deepin-event-log
    # 提供代码 dlopen 的裸名 libdeepin-event-log.so。
    depends:
      - deepin-event-log
      - libimageeditor6
      - libportaudio2
      - libffmpegthumbnailer4v5
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - dmidecode
